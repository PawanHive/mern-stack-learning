<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/input.css" />
  </head>
  <body>
    <div class="mt-20 mx-50 flex flex-wrap justify-center rounded border-2 ">
      <!-- Quote Container -->
      <div
        class="w-full bg-linear-to-t from-sky-500 to-indigo-500 text-white h-24 flex justify-center items-center font-bold text-xl"
      >
        News You Can Trust
      </div>
  
      <!-- Content Container -->
      <div class="text-center mt-6">
        <h3 class="text-lg font-semibold">Stay up to date with the Latest!</h3>
        <p>Subscribe to our newsletter for the latest news straight into your inbox</p>
        <form class="flex flex-wrap ">
          <input type="text" placeholder="your@gmail.com" class="w-full mx-52 rounded bg-slate-200 text-center placeholder:text-sm my-2 py-2">
          <button class="bg-blue-500 w-full mx-52 text-white py-2 rounded-full ">Subscribe Now</button>
        </form>
        <p class="my-6 text-sm">We value your privacy</p>
      </div>
    </div>
  </body>
</html>
